name: voice_chat_yanko
description: "Voice Chat Yanko - aplikasi voice chat room."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.3.10
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.1
  crypto: ^3.0.5
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  flutter_webrtc: ^1.6.3
  svgaplayer_3: ^3.0.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/legal/
    - assets/i18n/
    - assets/mascot.png
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2_800ExtraBold.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand_700Bold.ttf
          weight: 700
