name: voice_chat_yanko
description: "Voice Chat Yanko - aplikasi voice chat room."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/legal/
    - assets/i18n/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2_800ExtraBold.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand_700Bold.ttf
          weight: 700
