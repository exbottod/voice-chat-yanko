name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.exbottod --project-name voice_chat_yanko .

      - name: Inject native Kotlin + Java sources
        run: |
          mkdir -p android/app/src/main/kotlin android/app/src/main/java
          cp -rv native/android/kotlin/. android/app/src/main/kotlin/
          cp -rv native/android/java/. android/app/src/main/java/

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'MODIFY_AUDIO_SETTINGS' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application', 1)
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application', 1)
          if 'updateprovider' not in s:
              prov = ('        <provider\n'
                      '            android:name="androidx.core.content.FileProvider"\n'
                      '            android:authorities="${applicationId}.updateprovider"\n'
                      '            android:exported="false"\n'
                      '            android:grantUriPermissions="true">\n'
                      '            <meta-data\n'
                      '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                      '                android:resource="@xml/update_paths" />\n'
                      '        </provider>\n')
              s = s.replace('</application>', prov + '    </application>', 1)
          open(p, 'w').write(s)
          print('manifest ok')
          PYEOF

      - name: Tambah dependensi pembaruan
        run: |
          python3 - <<'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          grv = 'android/app/build.gradle'
          blok_kts = '\n\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n    implementation("org.apache.commons.compress:commons-compress:1.26.2")\n}\n'
          blok_grv = '\n\ndependencies {\n    implementation "androidx.core:core-ktx:1.13.1"\n    implementation "org.apache.commons.compress:commons-compress:1.26.2"\n}\n'
          for p, blok in ((kts, blok_kts), (grv, blok_grv)):
              if not os.path.exists(p):
                  continue
              s = open(p).read()
              if 'commons-compress' in s:
                  print('sudah ada:', p)
                  break
              open(p, 'w').write(s + blok)
              print('dependensi ditambah:', p)
              break
          PYEOF

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Inject custom Android resources
        run: |
          # Hapus ikon launcher bawaan Flutter supaya tidak bentrok dengan ic_launcher.webp
          find android/app/src/main/res -name "ic_launcher*.png" -delete || true
          if [ -d native/android/res ] && [ -n "$(ls -A native/android/res)" ]; then
            mkdir -p android/app/src/main/res
            cp -rv native/android/res/. android/app/src/main/res/
            echo "--- res hasil gabung ---"
            find android/app/src/main/res -maxdepth 1 -mindepth 1 -type d | sort
          else
            echo "belum ada resource kustom, pakai ikon bawaan Flutter"
          fi

      - name: Apply Firebase config
        run: python3 tool/apply_firebase.py

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.p12
          ls -la android/app/upload-keystore.p12
          test -s android/app/upload-keystore.p12 || (echo "keystore kosong, secret tidak terbaca" && exit 1)

      - name: Apply release signing
        run: python3 tool/setup_signing.py

      - name: Show gradle config
        run: |
          echo "--- settings ---"; cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle
          echo "--- app ---"; grep -nE 'applicationId|minSdk|google-services' android/app/build.gradle.kts 2>/dev/null || grep -nE 'applicationId|minSdk|google-services' android/app/build.gradle

      - name: Set versi dari nomor build
        run: |
          python3 - <<'PYEOF'
          import re
          run = "${{ github.run_number }}"
          p = "pubspec.yaml"
          s = open(p).read()
          s = re.sub(r"^version: .*$", "version: 1.0." + run + "+" + run, s, count=1, flags=re.M)
          open(p, "w").write(s)
          PYEOF
          grep '^version:' pubspec.yaml

      - name: Set app version
        run: |
          V=1.0.${{ github.run_number }}
          python3 - <<PYEOF
          import re
          p = 'pubspec.yaml'
          s = open(p).read()
          s = re.sub(r'^version: .*$', 'version: $V+${{ github.run_number }}', s, count=1, flags=re.M)
          open(p, 'w').write(s)
          PYEOF
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        env:
          KEYSTORE_PATH: upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Print signing certificate SHA
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -Ei 'SHA-1|SHA-256|Signer' || true

      - name: Show APK output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-yanko-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Siapkan manifest update dan APK di hosting
        run: |
          mkdir -p web
          python3 - <<'PYEOF'
          import json, os, re, glob, subprocess
          run = os.environ["RUN_NUMBER"]
          apk = "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          size = os.path.getsize(apk) if os.path.exists(apk) else 0

          def apk_version_code(path):
              sdk = (os.environ.get("ANDROID_HOME")
                     or os.environ.get("ANDROID_SDK_ROOT")
                     or "/usr/local/lib/android/sdk")
              for tool in ("aapt", "aapt2"):
                  cands = sorted(glob.glob(os.path.join(sdk, "build-tools", "*", tool)), reverse=True)
                  for cand in cands:
                      try:
                          out = subprocess.run([cand, "dump", "badging", path],
                                               capture_output=True, text=True, timeout=90).stdout
                      except Exception:
                          continue
                      m = re.search(r"versionCode='(\d+)'", out)
                      if m:
                          return int(m.group(1))
              return 0

          # versionCode asli dari APK arm64-v8a (flutter --split-per-abi memberi
          # offset per ABI: armeabi-v7a 1000+x, arm64-v8a 2000+x, x86_64 3000+x)
          code = apk_version_code(apk)
          if code <= 0:
              code = 2000 + int(run)

          data = {
              "apkSize": size,
              "versionCode": code,
              "buildNumber": int(run),
              "versionName": "1.0." + run,
              "apkUrl": "https://login-9604e.web.app/apk",
              "notes": os.environ.get("RELEASE_NOTES") or "Perbaikan dan peningkatan performa.",
          }
          os.makedirs("web", exist_ok=True)
          with open("web/latest.json", "w") as f:
              json.dump(data, f)
          print(json.dumps(data))
          PYEOF
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}

      - name: Buat patch unduhan kecil
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet bsdiff4
          python3 tool/buat_patch.py
          echo "--- isi web ---"
          ls -la web | head -20
          ls -la web/patch | head -10

      - name: Deploy hosting
        run: |
          npm install -g firebase-tools --silent
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fb.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb.json" firebase deploy --only hosting --project login-9604e --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Voice Chat Yanko v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Build otomatis dari commit ${{ github.sha }}.

            Fitur: login Google (Firebase Auth), tab Discover, Party, Moments, Messages, Me,
            room voice chat, aset gambar dari res, ikon launcher Yanko.

            Unduh `app-arm64-v8a-release.apk` untuk hampir semua HP Android.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
