name: Build APK Native

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd native_app
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
          test -s upload-keystore.p12 || (echo "keystore kosong" && exit 1)

      - name: Build release APK
        env:
          KEYSTORE_PATH: upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          cd native_app
          export APP_VERSION_CODE=$((2000 + $GITHUB_RUN_NUMBER))
          export APP_VERSION_NAME="2.0.$GITHUB_RUN_NUMBER"
          echo "versi $APP_VERSION_NAME ($APP_VERSION_CODE)"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-yanko-native
          path: native_app/app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: cp native_app/app/build/outputs/apk/release/app-release.apk native_app/voice-yanko-native.apk

      - name: Publish native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: Voice Yanko Native (uji coba)
          make_latest: false
          body: |
            APK native Kotlin, versi 2.0.${{ github.run_number }}.
            Unduh lewat https://voiceyanko.web.app/native
          files: |
            native_app/voice-yanko-native.apk
