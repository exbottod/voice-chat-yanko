name: Build APK Native
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
          test -s upload-keystore.p12 || (echo "keystore kosong, secret tidak terbaca" && exit 1)

      - name: Build release APK
        env:
          KEYSTORE_PATH: upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          APP_VERSION_CODE: ${{ 2000 + github.run_number }}
          APP_VERSION_NAME: 2.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-yanko-native
          path: native_app/app/build/outputs/apk/release/*.apk
